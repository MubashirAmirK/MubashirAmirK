
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow & Green Grid Layouts</title>
  <link rel="stylesheet" href="gridlayout.css">
</head>
<body>
  <!-- Yellow Grid Layout -->
  <section class="grid-layout yellow-layout">
    <h2 class="grid-title">Yellow Grid Layout</h2>
    <div class="grid-container">
      <div class="grid-item">Item 1</div>
      <div class="grid-item">Item 2</div>
      <div class="grid-item">Item 3</div>
      <div class="grid-item">Item 4</div>
    </div>
  </section>

  <!-- Green Grid Layout -->
  <section class="grid-layout green-layout">
    <h2 class="grid-title">Green Grid Layout</h2>
    <div class="grid-container">
      <div class="grid-item">Item A</div>
      <div class="grid-item">Item B</div>
      <div class="grid-item">Item C</div>
      <div class="grid-item">Item D</div>
    </div>
  </section>
</body>
</html>
